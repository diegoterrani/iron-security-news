name = "ironnews-og-render"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = false

# Custom domain: o wrangler cria o registro DNS na zona iron-security.com.
routes = [{ pattern = "render.iron-security.com", custom_domain = true }]

[observability]
enabled = true

# Secrets (wrangler secret put): RENDER_SECRET

[env.staging]
name = "ironnews-og-render-staging"
