name = "ironnews-edge-hooks"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = false

# Custom domain: o wrangler cria o registro DNS na zona iron-security.com.
routes = [{ pattern = "hooks.iron-security.com", custom_domain = true }]

[observability]
enabled = true

# Secrets (wrangler secret put): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# HEYGEN_WEBHOOK_SECRET, META_APP_SECRET

[env.staging]
name = "ironnews-edge-hooks-staging"
# routes = [{ pattern = "hooks-staging.<dominio>/*", zone_name = "<dominio>" }]
