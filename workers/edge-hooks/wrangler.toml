workers_dev = false

# Ajustar <dominio> quando o domínio for definido.
# routes = [{ pattern = "hooks.<dominio>/*", zone_name = "<dominio>" }]

[observability]
enabled = true

# Secrets (wrangler secret put): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# HEYGEN_WEBHOOK_SECRET, META_APP_SECRET

[env.staging]
name = "ironnews-edge-hooks-staging"
