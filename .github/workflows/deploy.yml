name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA para (re)deploy/rollback (vazio = HEAD)"
        required: false

concurrency: deploy-prod

permissions:
  contents: read

env:
  SHA: ${{ inputs.sha || github.sha }}

jobs:
  migrate:
    # Desligado até as contas/secrets existirem: ativar com a variável de repositório DEPLOY_ENABLED=true
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production   # exige aprovação manual
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: supabase/setup-cli@v1
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}" }
      - run: supabase db push
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}" }

  image:
    needs: migrate
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ironnews-executor:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/executor/Dockerfile
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: ${{ steps.img.outputs.ref }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

  vps:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS (chave restrita a deploy.sh)
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            "ironnews@${{ secrets.VPS_HOST }}" "$SHA"
          rm -f key
